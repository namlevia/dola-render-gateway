<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Sync</title>
  <style>
    :root {
      --bg: #0f1715;
      --card: #18221f;
      --card-border: #263531;
      --text: #e6ecea;
      --sub: #8fa19b;
      --accent: #00b875;
      --accent-hover: #009e63;
      --danger: #ef4444;
      --blue: #3b82f6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 184, 117, 0.5);
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #23342f;
      color: var(--accent);
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 5px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .cookie-preview {
      background: #131c19;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 14px;
      font-size: 11px;
      color: var(--sub);
    }
    .cookie-preview .highlight {
      color: var(--accent);
      font-weight: 600;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-sync {
      background: var(--accent);
      color: #fff;
    }
    .btn-sync:hover {
      background: var(--accent-hover);
    }
    .btn-copy {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-copy:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      word-break: break-word;
    }
    #status.success {
      display: block;
      background: rgba(0, 184, 117, 0.15);
      border: 1px solid rgba(0, 184, 117, 0.3);
      color: #34d399;
    }
    #status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Cookie Sync</span>
    </div>
    <span class="badge" id="versionBadge">v1.0</span>
  </div>

  <div class="form-group">
    <label for="platform">Platform</label>
    <select id="platform">
      <option value="dola" selected>Dola (dola.com)</option>
      <option value="facebook">Facebook (facebook.com)</option>
      <option value="custom">Current Active Tab</option>
    </select>
  </div>

  <div class="form-group">
    <label for="accName">Account Name (ID)</label>
    <input type="text" id="accName" placeholder="e.g. acc_01">
  </div>

  <div class="form-group">
    <label for="gatewayUrl">Gateway URL</label>
    <input type="text" id="gatewayUrl" value="http://127.0.0.1:8000">
  </div>

  <div class="form-group">
    <label for="adminKey">Admin Key (Optional)</label>
    <input type="password" id="adminKey" placeholder="Leave blank if not set">
  </div>

  <div class="cookie-preview" id="cookieStatus">
    Detecting cookies…
  </div>

  <div class="btn-row">
    <button class="btn-sync" id="btnSync">
      <span>⚡ 1-Click Sync to Gateway</span>
    </button>
    <button class="btn-copy" id="btnCopy">
      <span>📋 Copy JSON to Clipboard</span>
    </button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
